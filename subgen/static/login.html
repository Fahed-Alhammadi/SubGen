<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SubGen — Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login"><form id="login"><h1>SubGen</h1><p>Offline subtitle operations</p><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button><output></output></form><script>login.onsubmit=async(e)=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',body:new FormData(login)});if(r.ok)location='/';else login.querySelector('output').textContent='Invalid username or password'}</script></body></html>
