<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <title>Sign in – SubGen</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <script src="/static/js/theme-init.js"></script>
  <script type="module" src="/static/js/login.js"></script>
</head>
<body class="login-page">
  <main class="login">
    <div class="login-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="1" y="3" width="30" height="26" rx="6" class="brand-mark-frame"/>
        <rect x="7" y="16" width="18" height="3.2" rx="1.6" class="brand-mark-line"/>
        <rect x="10" y="21.5" width="12" height="3.2" rx="1.6" class="brand-mark-line"/>
        <rect x="7" y="8" width="3" height="3" rx="0.8" class="brand-mark-dot"/>
      </svg>
      <span>SubGen</span>
    </div>

    <div class="login-reel" aria-hidden="true">
      <div class="login-cue"><span class="tc">00:00:01,200</span><span>Subtitles for your whole library,</span></div>
      <div class="login-cue"><span class="tc">00:00:03,850</span><span>generated on your own hardware.</span></div>
      <div class="login-track"><span></span></div>
    </div>

    <form class="login-card" id="login-form" method="post" action="/api/login" novalidate>
      <h1>Sign in</h1>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="totp_code">Authenticator code <span class="muted">(if enabled)</span></label>
        <input class="input num" id="totp_code" name="totp_code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" aria-describedby="totp-help">
        <span class="field-help" id="totp-help">Only needed when two-factor sign-in is configured on the server.</span>
      </div>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary login-submit">Sign in</button>
    </form>

    <p class="login-foot small muted">Self-hosted and offline. Your media never leaves this server.</p>
  </main>
</body>
</html>
