<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SubGen</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><div class="login-glow"></div><main class="login-shell"><section class="login-story"><span class="brand-icon large">S</span><p class="eyebrow">LOCAL MEDIA INTELLIGENCE</p><h1>Every story.<br><em>Every language.</em></h1><p>Private, GPU-accelerated subtitle generation for your entire media library.</p><div class="feature-line"><span>● Offline-first</span><span>● NVIDIA ready</span><span>● Self-hosted</span></div></section><form id="login-form" class="login-card"><p class="kicker">SECURE ACCESS</p><h2>Welcome back</h2><p>Sign in to your SubGen control center.</p><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">Sign in <span>→</span></button><output></output></form></main><script>const f=document.querySelector('#login-form');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;b.textContent='Signing in…';const r=await fetch('/api/login',{method:'POST',body:new FormData(f)});if(r.ok)location='/';else{f.querySelector('output').textContent='Invalid username or password';b.disabled=false;b.innerHTML='Sign in <span>→</span>'}}</script></body></html>
