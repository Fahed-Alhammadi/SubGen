<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
  <title>SubGen</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <script src="/static/js/theme-init.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#page">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="/" aria-label="SubGen overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="1" y="3" width="30" height="26" rx="6" class="brand-mark-frame"/>
          <rect x="7" y="16" width="18" height="3.2" rx="1.6" class="brand-mark-line"/>
          <rect x="10" y="21.5" width="12" height="3.2" rx="1.6" class="brand-mark-line"/>
          <rect x="7" y="8" width="3" height="3" rx="0.8" class="brand-mark-dot"/>
        </svg>
        <span>SubGen</span>
        <span class="brand-version" data-version></span>
      </a>

      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link" href="/" data-nav="overview"><svg class="icon" aria-hidden="true"></svg><span>Overview</span></a></li>
          <li><a class="nav-link" href="/studio" data-nav="studio"><svg class="icon" aria-hidden="true"></svg><span>Studio</span></a></li>
          <li><a class="nav-link" href="/libraries" data-nav="libraries"><svg class="icon" aria-hidden="true"></svg><span>Libraries</span></a></li>
          <li><a class="nav-link" href="/queue" data-nav="queue"><svg class="icon" aria-hidden="true"></svg><span>Queue</span><span class="nav-count" data-queue-count hidden></span></a></li>
          <li><a class="nav-link" href="/models" data-nav="models"><svg class="icon" aria-hidden="true"></svg><span>Models</span></a></li>
          <li><a class="nav-link" href="/settings" data-nav="settings"><svg class="icon" aria-hidden="true"></svg><span>Settings</span></a></li>
          <li><a class="nav-link" href="/system" data-nav="system"><svg class="icon" aria-hidden="true"></svg><span>System</span></a></li>
        </ul>
      </nav>

      <div class="sidebar-foot">
        <a class="worker-pill" href="/" data-worker-pill data-state="unknown">
          <svg class="icon" aria-hidden="true"></svg><span class="label">Checking worker…</span>
        </a>
        <div class="row">
          <span class="sidebar-user truncate" data-user></span>
          <button type="button" class="btn btn-ghost btn-icon btn-sm" data-theme-toggle aria-label="Switch theme"></button>
          <button type="button" class="btn btn-ghost btn-icon btn-sm" data-logout aria-label="Sign out" title="Sign out"></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand" href="/" aria-label="SubGen overview">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect x="1" y="3" width="30" height="26" rx="6" class="brand-mark-frame"/>
            <rect x="7" y="16" width="18" height="3.2" rx="1.6" class="brand-mark-line"/>
            <rect x="10" y="21.5" width="12" height="3.2" rx="1.6" class="brand-mark-line"/>
            <rect x="7" y="8" width="3" height="3" rx="0.8" class="brand-mark-dot"/>
          </svg>
          <span>SubGen</span>
        </a>
        <a class="worker-pill" href="/" data-worker-pill data-state="unknown">
          <svg class="icon" aria-hidden="true"></svg><span class="label">Checking…</span>
        </a>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" data-theme-toggle aria-label="Switch theme"></button>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" data-logout aria-label="Sign out" title="Sign out"></button>
      </header>

      <main id="page" class="page" tabindex="-1" aria-live="off">
        <div class="skeleton-list" role="status" aria-label="Loading">
          <span class="skeleton line-lg"></span><span class="skeleton block"></span><span class="skeleton block"></span>
        </div>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alerts" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <noscript><p class="page">SubGen needs JavaScript enabled in your browser.</p></noscript>
</body>
</html>
