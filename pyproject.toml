[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subgen"
version = "0.9.1"
description = "Offline-first subtitle generation for self-hosted media libraries"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi==0.163.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.9",
  "pydantic-settings==2.16.3",
  "pwdlib[argon2]==0.4.2",
  "python-multipart==0.0.34",
  "itsdangerous==2.2.0",
  "faster-whisper==1.2.1",
  "transformers==5.23.0",
  "huggingface-hub==2.4.0",
  "sentencepiece==0.2.3",
  "torch==2.10.0",
  "pysubs2==1.9.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.14.5"]

[tool.hatch.build.targets.wheel]
packages = ["subgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

