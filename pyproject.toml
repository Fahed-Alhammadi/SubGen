[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subgen"
version = "0.1.0"
description = "Offline-first subtitle generation for self-hosted media libraries"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.121.1",
  "uvicorn[standard]==0.38.0",
  "sqlalchemy==2.0.44",
  "alembic==1.17.2",
  "pydantic-settings==2.11.0",
  "pwdlib[argon2]==0.3.0",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  "faster-whisper==1.2.1",
  "transformers==4.57.1",
  "sentencepiece==0.2.1",
  "torch==2.9.1",
  "pysubs2==1.8.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.1", "ruff==0.14.5"]

[tool.hatch.build.targets.wheel]
packages = ["subgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

