name: Publish container
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fahed-alhammadi/subgen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Smoke test published image
        run: |
          docker run -d --name subgen-smoke -p 127.0.0.1:18080:8080 \
            -e SUBGEN_ADMIN_PASSWORD=release-smoke-password \
            -e SUBGEN_SECRET_KEY=release-smoke-secret-key-at-least-32-characters \
            -e SUBGEN_SECURE_COOKIES=false \
            ghcr.io/fahed-alhammadi/subgen@${{ steps.build.outputs.digest }}
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:18080/health && exit 0
            sleep 2
          done
          docker logs subgen-smoke
          exit 1
      - if: always()
        run: docker rm -f subgen-smoke 2>/dev/null || true
