name: Publish container
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/fahed-alhammadi/subgen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Smoke test published image
        # Same settings as docker-compose.yaml: only the password, hardened, PUID/PGID 1000 by default.
        run: |
          docker run -d --name subgen-smoke -p 127.0.0.1:18080:8080 \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -e SUBGEN_ADMIN_PASSWORD=release-smoke-password \
            -e SUBGEN_AUTO_INSTALL_MODELS=false \
            ghcr.io/fahed-alhammadi/subgen@${{ steps.build.outputs.digest }}
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              # The server runs as 1000:1000, not root
              test "$(docker exec subgen-smoke stat -c %u:%g /proc/1)" = "1000:1000"
              # Sign-in works over plain HTTP (cookies are only marked Secure behind HTTPS)
              curl -fsS -c jar -d username=admin -d password=release-smoke-password \
                http://127.0.0.1:18080/api/login
              curl -fsS -b jar http://127.0.0.1:18080/api/session
              exit 0
            fi
            sleep 2
          done
          docker logs subgen-smoke
          exit 1
      - if: always()
        run: docker rm -f subgen-smoke 2>/dev/null || true
