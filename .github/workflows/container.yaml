name: Publish container
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fahed-alhammadi/subgen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: Smoke test published image
        # Same settings as docker-compose.yaml: only the password, hardened, PUID/PGID 1000 by default.
        run: |
          docker run -d --name subgen-smoke -p 127.0.0.1:18080:8080 \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -e SUBGEN_ADMIN_PASSWORD=release-smoke-password \
            -e SUBGEN_AUTO_INSTALL_MODELS=false \
            ghcr.io/fahed-alhammadi/subgen@${{ steps.build.outputs.digest }}
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              # The server runs as 1000:1000, not root
              test "$(docker exec subgen-smoke stat -c %u:%g /proc/1)" = "1000:1000"
              # Sign-in works over plain HTTP (cookies are only marked Secure behind HTTPS)
              curl -fsS -c jar -d username=admin -d password=release-smoke-password \
                http://127.0.0.1:18080/api/login
              curl -fsS -b jar http://127.0.0.1:18080/api/session
              exit 0
            fi
            sleep 2
          done
          docker logs subgen-smoke
          exit 1
      - if: always()
        run: docker rm -f subgen-smoke 2>/dev/null || true
