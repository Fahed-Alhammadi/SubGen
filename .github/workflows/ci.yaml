name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.14.5
      - run: ruff check .
      - run: cp .env.example .env && docker compose config --quiet
      - run: shellcheck docker/entrypoint.sh
      - run: docker build --check .

