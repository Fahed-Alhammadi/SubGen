name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: docker compose config --quiet
        env:
          SUBGEN_ADMIN_PASSWORD: ci-password-with-12-characters
          SUBGEN_SECRET_KEY: ci-secret-key-that-is-at-least-32-characters
      - run: docker build --check .

