name: NVIDIA smoke test
# Started by hand only (Actions → NVIDIA smoke test → Run workflow) on a self-hosted GPU host.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Container image to validate (must be ghcr.io/fahed-alhammadi/subgen)
        required: true
        default: ghcr.io/fahed-alhammadi/subgen:latest
permissions:
  contents: read
  packages: read
jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, nvidia]
    env:
      # Passed through the environment, never pasted into the script, so the input can't inject commands.
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Only accept SubGen images
        run: |
          case "$IMAGE" in
            ghcr.io/fahed-alhammadi/subgen:*|ghcr.io/fahed-alhammadi/subgen@sha256:*) ;;
            *) echo "::error::Image must be ghcr.io/fahed-alhammadi/subgen:<tag> or @sha256:<digest>"; exit 1 ;;
          esac
          case "$IMAGE" in
            *[!A-Za-z0-9._:/@-]*) echo "::error::Image name has unexpected characters"; exit 1 ;;
          esac
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - name: Validate CUDA and media runtime
        run: |
          docker run --rm --gpus all "$IMAGE" python3 -c \
            "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
          docker run --rm "$IMAGE" ffmpeg -version
