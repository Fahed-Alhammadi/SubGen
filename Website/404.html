<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | SubGen</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- GitHub Pages serves this file for any missing path, so asset URLs are absolute to the project site. -->
  <link rel="icon" href="/SubGen/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/SubGen/assets/site.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; padding: 40px 16px; }
    .lost-frame { position: relative; width: min(560px, 100%); aspect-ratio: 16 / 9; border-radius: 14px; background: linear-gradient(180deg, #1a2b45, #0a0e15); display: grid; align-items: end; justify-items: center; padding-bottom: 7%; }
    .lost-frame p { margin: 0; color: #fff; font-weight: 700; text-align: center; font-size: clamp(1rem, .7rem + 1.4vw, 1.4rem); line-height: 1.3; text-shadow: 0 0 2px #000, 0 2px 3px #000; }
    .lost h1 { margin-top: 28px; font-size: clamp(1.8rem, 1.4rem + 1.6vw, 2.4rem); }
    .lost .lede { margin-top: 10px; }
  </style>
</head>
<body>
  <main class="lost wrap">
    <div class="lost-frame" aria-hidden="true"><p>[silence]</p></div>
    <h1>Nothing to subtitle here</h1>
    <p class="lede">This page does not exist. The address may be mistyped, or the page has moved.</p>
    <div class="actions">
      <a class="button button-primary" href="/SubGen/">Go to the SubGen home page</a>
      <a class="button" href="https://github.com/Fahed-Alhammadi/SubGen">Open the GitHub repository</a>
    </div>
    <p class="legal" style="margin-top:40px;color:var(--muted);font-size:.9rem">© 2026 Fahed Alhammadi</p>
  </main>
</body>
</html>
